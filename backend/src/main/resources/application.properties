# NourishNet Spring Boot Application Properties
server.port=8080
spring.application.name=nourishnet-backend

# Serve frontend directly from the frontend directory for seamless single-command development
spring.web.resources.static-locations=file:../frontend/,file:frontend/,classpath:/static/

# Logging
logging.level.com.nourishnet=INFO
logging.level.org.springframework.web=INFO

# Application Profile & Demo Notice
nourishnet.data-source=IN_MEMORY_COLLECTIONS
nourishnet.data-warning=All backend data is held in temporary thread-safe in-memory memory structures and will reset upon server restart.
