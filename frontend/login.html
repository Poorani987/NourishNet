<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — NourishNet</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="display:flex;flex-direction:column;min-height:100vh;">

  <!-- Simple Header -->
  <header class="site-navbar">
    <div class="navbar-inner">
      <a href="index.html" class="brand-link">
        <div class="brand-icon">🌱</div>
        <div class="brand-text">
          <h1>NourishNet</h1>
          <span>Smart Food Redistribution</span>
        </div>
      </a>
      <a href="register.html" class="btn btn-outline btn-sm">Create New Account</a>
    </div>
  </header>

  <!-- Login Form Container -->
  <main style="flex:1;display:flex;align-items:center;justify-content:center;padding:2.5rem 1.5rem;">
    <div class="card" style="width:100%;max-width:480px;padding:2.25rem;box-shadow:var(--shadow-lg);">
      <div style="text-align:center;margin-bottom:1.75rem;">
        <div style="font-size:2.5rem;margin-bottom:0.5rem;">🔐</div>
        <h2 style="font-size:1.8rem;color:var(--color-forest-dark);">Welcome Back</h2>
        <p style="color:var(--text-muted);font-size:0.92rem;">Sign in to access your role-specific dashboard</p>
      </div>

      <!-- 1-Click Demo Fill Selector -->
      <div style="background:var(--color-pastel-tint);border-radius:var(--radius-md);padding:1rem;margin-bottom:1.5rem;border:1px solid var(--border-subtle);">
        <div style="font-size:0.8rem;font-weight:700;color:var(--color-forest-dark);margin-bottom:0.5rem;text-transform:uppercase;letter-spacing:0.04em;">
          ⚡ 1-Click Demo Login:
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;">
          <button type="button" class="btn-demo-pill" onclick="fillAndSubmit('admin@nourishnet.org', 'admin123')">
            👑 Admin
          </button>
          <button type="button" class="btn-demo-pill" onclick="fillAndSubmit('greenbites@restaurant.com', 'donor123')">
            🍲 Donor (Bistro)
          </button>
          <button type="button" class="btn-demo-pill" onclick="fillAndSubmit('hope.shelter@ngo.org', 'recip123')">
            🤝 Recipient (NGO)
          </button>
          <button type="button" class="btn-demo-pill" onclick="fillAndSubmit('alex.driver@volunteer.org', 'volun123')">
            🚚 Volunteer (Van)
          </button>
        </div>
      </div>

      <!-- Main Login Form -->
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="name@organization.org" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="Enter password" required>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn btn-primary" style="width:100%;margin-top:0.75rem;">
          Sign In ➔
        </button>
      </form>

      <div style="text-align:center;margin-top:1.5rem;font-size:0.88rem;color:var(--text-muted);">
        Don't have an account yet? <a href="register.html" style="font-weight:600;color:var(--color-forest-main);">Register here</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function fillAndSubmit(email, password) {
      document.getElementById('loginEmail').value = email;
      document.getElementById('loginPassword').value = password;
      await handleLogin();
    }

    async function handleLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginSubmitBtn');

      btn.disabled = true;
      btn.textContent = 'Verifying credentials...';

      try {
        const user = await Auth.login(email, password);
        setTimeout(() => {
          Auth.redirectToDashboard(user.role);
        }, 500);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Sign In ➔';
      }
    }

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      handleLogin();
    });
  </script>
</body>
</html>
